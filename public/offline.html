<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Active Network Required — Chit Funds Manager</title>
  <meta name="theme-color" content="#0B0F19">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0B0F19;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .barrier-card {
      background: #111827;
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: 1.75rem;
      padding: 2.25rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo-container {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-img {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
    }
    .badge-offline {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #FB7185;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .dot-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #F43F5E;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.85rem;
      color: #94A3B8;
      line-height: 1.55;
      margin-bottom: 1.5rem;
    }
    .info-box {
      background: #090D1A;
      border: 1px solid #1E293B;
      border-radius: 0.875rem;
      padding: 0.85rem;
      font-size: 0.75rem;
      color: #64748B;
      margin-bottom: 1.5rem;
    }
    .retry-btn {
      width: 100%;
      padding: 0.85rem 1.25rem;
      border-radius: 0.875rem;
      background: linear-gradient(135deg, #4F46E5 0%, #2A1DB8 100%);
      color: #FFFFFF;
      font-size: 0.825rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.35);
      transition: all 0.15s ease;
    }
    .retry-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .retry-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="barrier-card">
    <div class="logo-container">
      <img src="/logo.svg" alt="Chit Funds Logo" class="logo-img" />
    </div>

    <div class="badge-offline">
      <span class="dot-pulse"></span>
      Active Network Required
    </div>

    <h1>No Internet Connection</h1>
    <p>
      Chit Funds Manager requires an active network connection to safeguard treasury vaults, live auction bidding, and encrypted member ledger synchronization.
    </p>

    <div class="info-box">
      Please verify your Wi-Fi or mobile data connection to access the financial portal.
    </div>

    <button type="button" class="retry-btn" onclick="retryConnection()" id="retryBtn">
      Retry Connection
    </button>
  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById('retryBtn');
      btn.innerText = 'Checking Network...';
      btn.style.opacity = '0.7';

      fetch('/api/health-check', { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          window.location.reload();
        })
        .catch(() => {
          if (navigator.onLine) {
            window.location.reload();
          } else {
            setTimeout(() => {
              btn.innerText = 'Retry Connection';
              btn.style.opacity = '1';
            }, 600);
          }
        });
    }

    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
