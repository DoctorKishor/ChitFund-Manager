<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Emerald-Cyan Loop Gradient (Circulation / Dividends) -->
    <linearGradient id="growthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Indigo-Violet Vault Arc Gradient (Treasury / Vaults) -->
    <linearGradient id="vaultGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Gold Core Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle with Subtle Inset Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" filter="url(#softShadow)" />

  <!-- Background Ambient Glow Center -->
  <circle cx="256" cy="256" r="140" fill="#4F46E5" opacity="0.15" filter="url(#glow)" />
  <circle cx="210" cy="220" r="90" fill="#10B981" opacity="0.12" filter="url(#glow)" />

  <!-- Inner Geometric Vault Hexagon Grid Ring (Subtle Watermark) -->
  <polygon points="256,108 384,182 384,330 256,404 128,330 128,182" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6,6" />

  <!-- Interlocking Circulation Loops (Abstract C and F Emblem) -->
  <!-- Outer Arc / Loop (C shape for Chit) -->
  <path d="M 290 148 C 190 148, 136 200, 136 270 C 136 340, 195 382, 296 382 C 345 382, 380 365, 396 348"
        fill="none" stroke="url(#growthGrad)" stroke-width="32" stroke-linecap="round" filter="url(#softShadow)" />

  <!-- Inner Crossbars / Vault Loop (F shape for Funds) -->
  <path d="M 216 206 L 358 206"
        fill="none" stroke="url(#vaultGrad)" stroke-width="28" stroke-linecap="round" filter="url(#softShadow)" />
  <path d="M 216 276 L 326 276"
        fill="none" stroke="url(#vaultGrad)" stroke-width="26" stroke-linecap="round" filter="url(#softShadow)" />

  <!-- Vertical Vault Anchor Spine -->
  <path d="M 216 172 L 216 350"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="28" stroke-linecap="round" filter="url(#softShadow)" />

  <!-- Central Gold Coin Node / Rupee Spark (Focal Point of Wealth / Dividend) -->
  <g transform="translate(356, 318)" filter="url(#glow)">
    <circle cx="0" cy="0" r="32" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="3" />
    <!-- Rupee symbol stylized in gold coin -->
    <path d="M -10 -10 L 10 -10 M -10 -4 L 8 -4 M -10 -10 L -10 6 C -2 6, 8 6, 8 -1 C 8 -7, -2 -7, -10 -7 M -2 5 L 8 13"
          fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
